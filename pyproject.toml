[project]
name = "hlbb"
version = "1.0.0"
description = "Circuit description in Python -> breadboard picture, wiring picture, connection check, KiCad bridge"
requires-python = ">=3.10"

[project.optional-dependencies]
mapa = ["pyyaml"]

[project.scripts]
hlbb = "hlbb.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hlbb"]

[tool.setuptools.package-data]
hlbb = ["mapa_web/*", "kicad_tpl/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
